apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

project.ext.vectoricons = [
    iconFontNames: [
        'Ionicons.ttf',
        'MaterialCommunityIcons.ttf',
        'Feather.ttf',
        'MaterialIcons.ttf',
        'FontAwesome.ttf',
        'FontAwesome5_Solid.ttf',
        'FontAwesome5_Regular.ttf',
        'FontAwesome5_Brands.ttf'
    ]
]
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.driverclient"
    defaultConfig {
        applicationId "com.driverclient"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        vectorDrawables.useSupportLibrary = true
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        jniLibs {
            // Compress .so files inside APK instead of storing uncompressed (AGP 8+ default)
            useLegacyPackaging = true
            pickFirsts += [
                'lib/x86/libc++_shared.so',
                'lib/x86_64/libjsc.so',
                'lib/arm64-v8a/libjsc.so',
                'lib/arm64-v8a/libc++_shared.so',
                'lib/x86_64/libc++_shared.so',
                'lib/armeabi-v7a/libc++_shared.so'
            ]
        }
    }
}

// Exclude unused Agora extension modules (Video KYC only uses basic 1-to-1 audio/video RTC)
configurations.configureEach {
    exclude group: "io.agora.rtc", module: "full-voice-drive"
    exclude group: "io.agora.rtc", module: "clear-vision"
    exclude group: "io.agora.rtc", module: "spatial-audio"
    exclude group: "io.agora.rtc", module: "ains"
    exclude group: "io.agora.rtc", module: "full-face-capture"
    exclude group: "io.agora.rtc", module: "full-virtual-background"
    exclude group: "io.agora.rtc", module: "aiaec"
    exclude group: "io.agora.rtc", module: "audio-beauty"
    exclude group: "io.agora.rtc", module: "full-content-inspect"
    exclude group: "io.agora.rtc", module: "full-vqa"
    exclude group: "io.agora.rtc", module: "full-video-av1-codec-enc"
    exclude group: "io.agora.rtc", module: "full-face-detect"
    exclude group: "io.agora.rtc", module: "screen-capture"
    exclude group: "io.agora.rtc", module: "full-screen-sharing"
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation "com.google.android.gms:play-services-maps:18.1.0"
    implementation "com.google.android.gms:play-services-auth:21.3.0"
    implementation platform("com.google.firebase:firebase-bom:32.8.0")
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.firebase:firebase-messaging"
}
